model_list:
  - model_name: local-gpt-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: http://127.0.0.1:4000/v1
      api_key: local-no-auth-placeholder
      store: false
      timeout: 40
      max_retries: 0
